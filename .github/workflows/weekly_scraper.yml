name: Weekly Freight Indices Scraper

on:
  schedule:
    # Fridays 07:33 UTC = 15:33 Beijing time, 30 minutes after SCFI publication
    # (08:33 CET / 09:33 CEST). Charts and newsletter follow automatically via workflow_run.
    - cron: '33 7 * * 5'
  workflow_dispatch:  # Allows manual triggering

jobs:
  scrape-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run scraper
      env:
        EMAIL_CONFIG: ${{ secrets.EMAIL_CONFIG }}
        ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      run: python src/scraper.py
    
    - name: Commit and push updated CSV files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/*.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update freight indices data - $(date +'%Y-%m-%d')" && git push)
