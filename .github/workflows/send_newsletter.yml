name: Send Weekly Newsletter

on:
  # Runs after a successful plot run that was itself triggered by the scraper
  workflow_run:
    workflows: ["Generate Freight Indices Plots"]
    types: [completed]
  workflow_dispatch:  # Allows manual triggering

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main  # Includes the charts just committed
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Process signups and unsubscribes
      env:
        EMAIL_CONFIG: ${{ secrets.EMAIL_CONFIG }}
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      run: python src/subscriber_manager.py
    
    - name: Send newsletter
      env:
        EMAIL_CONFIG: ${{ secrets.EMAIL_CONFIG }}
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      run: python src/newsletter_generator.py
