name: Generate Freight Indices Plots

on:
  # Runs after a successful scraper run triggered by cron-job.org
  workflow_run:
    workflows: ["Weekly Freight Indices Scraper"]
    types: [completed]
  workflow_dispatch:  # Allows manual triggering

jobs:
  generate-plots:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'repository_dispatch')
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main  # Includes the CSVs just committed by the scraper
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate plots
      run: python src/plot_generator.py
    
    - name: Commit and push plots
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add output/**/*.png
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update freight indices charts - $(date +'%Y-%m-%d')" && git push)
