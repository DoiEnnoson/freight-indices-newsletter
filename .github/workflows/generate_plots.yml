name: Generate Freight Indices Plots

on:
  schedule:
    # Jeden Freitag um 14:30 deutscher Zeit (12:30 UTC im Winter, 13:30 UTC im Sommer)
    - cron: '30 12 * * 5'
  workflow_dispatch:  # Ermöglicht manuelles Auslösen

jobs:
  generate-plots:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate plots
      run: python src/plot_generator.py
    
    - name: Commit and push plots
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add output/**/*.png
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update freight indices charts - $(date +'%Y-%m-%d')" && git push)
