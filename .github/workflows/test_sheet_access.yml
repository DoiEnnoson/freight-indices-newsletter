name: Test Sheet Access

# Temporary: runs the subscriber manager from this branch. Remove before merging.
on:
  push:
    branches: [subscriber-signup]
    paths: ['.github/workflows/test_sheet_access.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - name: Process signups and unsubscribes
      env:
        EMAIL_CONFIG: ${{ secrets.EMAIL_CONFIG }}
        GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      run: python src/subscriber_manager.py
